plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dhp.hmy.bubble'
version = '1.0.0'

android {
  namespace "dhp.hmy.bubble"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    consumerProguardFiles 'proguard-rules.pro'
  }
}

dependencies {
  // BubbleMetadata, MessagingStyle, ShortcutManagerCompat.
  implementation 'androidx.core:core:1.17.0'
  // ReactActivity for the bubble window; the version comes from the app's React Native.
  implementation 'com.facebook.react:react-android'
}
