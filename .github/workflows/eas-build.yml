name: EAS Build

on:
  push:
    branches:
      - dhphuc
  workflow_dispatch:

jobs:
  eas-build:
    name: Trigger EAS Build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [android, ios]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Saves npm cache on GitHub Actions runner

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
          cache: true

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build on EAS
        env:
          EAS_SKIP_AUTO_FINGERPRINT: "1"
          EXPO_NO_FINGERPRINT: "1"
        run: eas build --platform ${{ matrix.platform }} --profile production --non-interactive --no-wait
