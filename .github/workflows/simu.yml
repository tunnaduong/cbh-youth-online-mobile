name: Build iOS Simulator

on:
  push:
    branches:
      - 'dhphuc-55'
      - 'dhphuc'
  workflow_dispatch:

permissions:
  contents: write

# One build per branch at a time: a newer push cancels the older run.
concurrency:
  group: build-ios-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-simulator:
    name: Build iOS Simulator App
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure Node path for Xcode build phases
        run: |
          sudo ln -sf $(which node) /usr/local/bin/node

      - name: Install dependencies
        run: npm ci

      # android/ and ios/ are not in git: generate the native project from
      # app.json and the config plugins.
      - name: Generate the native project (expo prebuild)
        env:
          CI: "1"
        run: |
          npx expo prebuild --platform ios --no-install
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local

      # Compiler cache. Most of an iOS build is compiling the pods (React
      # Native, Expo modules...), the same code on every run; ccache keeps the
      # compiled objects between runs, so only what changed is compiled.
      # React Native's Podfile wires it in when apple.ccacheEnabled is set -
      # done here, for CI only, so a local build does not need ccache.
      - name: Set up ccache
        run: |
          which ccache || brew install ccache
          # Xcode's build phases do not see Homebrew's PATH.
          sudo ln -sf "$(which ccache)" /usr/local/bin/ccache
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          node -e '
            const fs = require("fs");
            const file = "ios/Podfile.properties.json";
            const props = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, "utf8")) : {};
            props["apple.ccacheEnabled"] = "true";
            fs.writeFileSync(file, JSON.stringify(props, null, 2) + "\n");
          '

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          # Saved under a new key every run (a cache is immutable), restored
          # from the most recent one.
          key: ${{ runner.os }}-ccache-simulator-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ccache-simulator-

      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install Pods
        run: |
          cd ios
          pod install

      - name: Detect iOS Project Name
        run: |
          cd ios
          WORKSPACE_NAME=$(basename *.xcworkspace .xcworkspace)
          echo "APP_NAME=$WORKSPACE_NAME" >> $GITHUB_ENV

      # Already on GitHub's macOS images; installed only if it is missing.
      - name: Install xcbeautify
        run: which xcbeautify || brew install xcbeautify

      - name: Build iOS Simulator App (Release Configuration)
        run: |
          cd ios
          set -o pipefail
          xcodebuild -workspace "${{ env.APP_NAME }}.xcworkspace" \
            -scheme "${{ env.APP_NAME }}" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/simulator_derived_data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | xcbeautify --quiet --renderer github-actions

      - name: ccache statistics
        if: always()
        run: ccache --show-stats || true

      - name: Compress Simulator .app File
        run: |
          cd "$RUNNER_TEMP/simulator_derived_data/Build/Products/Release-iphonesimulator"
          zip -r "$RUNNER_TEMP/${{ env.APP_NAME }}-simulator.zip" "${{ env.APP_NAME }}.app"

      - name: Upload Binaries to Release (Overwrite Enabled)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dhphuc-ios
          files: ${{ runner.temp }}/*-simulator.zip
          fail_on_unmatched_files: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Simulator Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-simulator-zip
          path: ${{ runner.temp }}/*-simulator.zip
          retention-days: 7
