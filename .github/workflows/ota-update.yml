name: OTA Update (expo-updates)

on:
  push:
    branches:
      - main
      - dhphuc
    paths-ignore:
      - '**.md'
      - '.github/workflows/build-*.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Update Channel (leave empty to auto-detect from branch: dhphuc->preview, main->production)'
        required: false
        default: ''
      message:
        description: 'Update commit / release note (defaults to commit message)'
        required: false
        default: ''
      runtime_version:
        description: 'Runtime version override (leave empty to use app.json)'
        required: false
        default: ''
      build_number:
        description: 'Build number override (leave empty to resolve from latest CI action build run number)'
        required: false
        default: ''

concurrency:
  group: ota-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-ota:
    name: Publish OTA Update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve runtime version
        id: runtime
        run: |
          INPUT_VERSION="${{ github.event.inputs.runtime_version }}"
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> $GITHUB_OUTPUT
          else
            RESOLVED=$(node -p "require('./app.json').expo.runtimeVersion || '7.4.10'")
            echo "version=$RESOLVED" >> $GITHUB_OUTPUT
          fi

      - name: Resolve update message, channel, and build number
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          INPUT_CHANNEL="${{ github.event.inputs.channel }}"
          if [ -n "$INPUT_CHANNEL" ]; then
            echo "channel=$INPUT_CHANNEL" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "dhphuc" ]; then
            echo "channel=preview" >> $GITHUB_OUTPUT
          else
            echo "channel=production" >> $GITHUB_OUTPUT
          fi

          INPUT_MSG="${{ github.event.inputs.message }}"
          if [ -n "$INPUT_MSG" ]; then
            echo "message=$INPUT_MSG" >> $GITHUB_OUTPUT
          else
            SUBJECT=$(git log -1 --pretty=format:"%s")
            echo "message=$SUBJECT" >> $GITHUB_OUTPUT
          fi

          INPUT_BUILD="${{ github.event.inputs.build_number }}"
          if [ -n "$INPUT_BUILD" ]; then
            BUILD_NUM="$INPUT_BUILD"
          else
            latest=0
            for workflow in build-android.yml build-ios.yml; do
              number=$(gh api "repos/$REPO/actions/workflows/$workflow/runs?per_page=1" --jq '.workflow_runs[0].run_number // 0' 2>/dev/null || echo 0)
              echo "$workflow: run #$number"
              if [ "$number" -gt "$latest" ]; then latest=$number; fi
            done
            if [ "$latest" -gt 0 ]; then
              BUILD_NUM="$latest"
            else
              BUILD_NUM=$(node -p "require('./app.json').expo.android.versionCode || 1012")
            fi
          fi

          MIN_NATIVE=$(node -p "require('./app.json').expo.extra?.minNativeBuild || 1008")
          echo "build_number=$BUILD_NUM" >> $GITHUB_OUTPUT
          echo "min_native_build=$MIN_NATIVE" >> $GITHUB_OUTPUT

      - name: Ensure app.json matches target channel and build number
        run: |
          node scripts/set-ota-channel.js "${{ steps.meta.outputs.channel }}"
          node scripts/set-build-number.js "${{ steps.meta.outputs.build_number }}"

      - name: Export update bundle with Expo CLI
        run: npx expo export --platform android --platform ios --output-dir dist

      - name: Archive dist package
        run: |
          cd dist
          zip -r ../dist.zip .
          cd ..

      - name: Publish update to self-hosted server
        env:
          OTA_DEPLOY_TOKEN: ${{ secrets.OTA_DEPLOY_TOKEN }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          RUNTIME_VERSION: ${{ steps.runtime.outputs.version }}
          MESSAGE: ${{ steps.meta.outputs.message }}
          BUILD_NUMBER: ${{ steps.meta.outputs.build_number }}
          MIN_NATIVE_BUILD: ${{ steps.meta.outputs.min_native_build }}
        run: |
          if [ -z "$OTA_DEPLOY_TOKEN" ]; then
            echo "::error::Secret OTA_DEPLOY_TOKEN is not set in repository secrets."
            exit 1
          fi

          RESPONSE=$(curl --fail-with-body -s -S -X POST "https://api.chuyenbienhoa.com/v1.0/admin/ota/publish" \
            -H "Authorization: Bearer ${OTA_DEPLOY_TOKEN}" \
            -F "archive=@dist.zip" \
            -F "channel=${CHANNEL}" \
            -F "runtime_version=${RUNTIME_VERSION}" \
            -F "message=${MESSAGE}" \
            -F "build_number=${BUILD_NUMBER}" \
            -F "min_native_build=${MIN_NATIVE_BUILD}")

          echo "Publish Response:"
          echo "$RESPONSE"
