name: OTA Update (EAS)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'EAS Update Channel (e.g. production, preview)'
        required: true
        default: 'production'
      message:
        description: 'Update commit / release note'
        required: false
        default: 'OTA update via GitHub Actions'

concurrency:
  group: ota-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Publish OTA Update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Publish OTA Update with EAS CLI
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli update --channel ${{ github.event.inputs.channel }} --message "${{ github.event.inputs.message }}" --non-interactive
