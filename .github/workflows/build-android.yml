name: Build Android APK

on:
  push:
    branches:
      - dhphuc-55
      - dhphuc
  workflow_dispatch: # Keeps the manual trigger option available

# One build per branch at a time: a newer push cancels the older run, so two
# runs never publish over each other's APK.
concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    # Cấp quyền ghi vào mục Release của repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The build number (iOS buildNumber, Android versionCode) is this
      # workflow's run number, so build #N of the CI is build N of the app.
      # Only this checkout's app.json is patched; the number is committed by
      # build-number.yml when the branch is merged into main.
      - name: Set build number to the CI run number
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: node scripts/set-build-number.js "$BUILD_NUMBER"

      # android/ and ios/ are not in git: generate the native project from
      # app.json and the config plugins.
      - name: Generate the native project (expo prebuild)
        env:
          CI: "1"
        run: |
          npx expo prebuild --platform android --no-install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle' # Tự động cache các gói phụ thuộc Java/Gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: false

      - name: Cache Gradle caches & wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/app/build.gradle', '**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # No cache of android/app/build: restoring the previous run's outputs
      # (including its APK) let Gradle's incremental packaging update an old
      # APK in place, and installs then failed with "SHA-256 digest of
      # contents did not verify". Dependencies and task outputs still come
      # from the Gradle caches above.

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Clean previous build outputs (avoid stale JS bundle from cache)
        run: |
          cd android
          ./gradlew clean --no-daemon

      - name: Tối ưu cấu hình Gradle (Tăng RAM)
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.parallel=false" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m" >> ~/.gradle/gradle.properties
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.workers.max=2" >> ~/.gradle/gradle.properties
  

      - name: Build Android Release & Debug APK (arm64-v8a)
        run: |
          cd android
          ./gradlew assembleRelease \
          -PreactNativeArchitectures=arm64-v8a \
          -x lint -x test \
          -x lintVitalRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease \
          --no-daemon

      # Never publish an APK Android would refuse to install: check its
      # signature the way the package installer does. The .sha256 lets a
      # download be checked against the file CI built.
      - name: Verify the APK signature
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p dist
          cp "$APK" dist/app-release.apk
          (cd dist && sha256sum app-release.apk | tee app-release.apk.sha256)
          echo "Build $BUILD_NUMBER"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: dist/*.apk
          retention-days: 7

      # Cập nhật đè / Khởi tạo bản Prerelease lên GitHub Releases cho Android
      - name: Create or Update Pre-release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          # Drop the previous build's files before uploading the new ones.
          removeArtifacts: true
          artifacts: |
            dist/app-release.apk
            dist/app-release.apk.sha256
          tag: "dhphuc-android"
          name: "${{ github.sha }}"
          body: |
            ### 🤖 Android Build Details
            - **Commit SHA:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`
            - **Changelog:** ${{ github.event.head_commit.message }}
            
            Tải file `app-release.apk` (Release arm64-v8a, build #${{ github.run_number }}) ở phần **Assets** bên dưới để cài đặt. File `.sha256` để kiểm tra file tải về có nguyên vẹn không.
          prerelease: true
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # Tự động gửi thông báo an toàn qua Discord Webhook nhờ Python
      - name: Send Discord Notification
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_ANDROID }}
          JOB_STATUS: ${{ job.status }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: python
        run: |
          import os, json, urllib.request

          status = os.environ.get('JOB_STATUS', '')
          ref_name = os.environ.get('REF_NAME', '')
          sha = os.environ.get('COMMIT_SHA', '')
          run_number = os.environ.get('RUN_NUMBER', '')
          webhook_url = os.environ.get('WEBHOOK_URL', '')
          commit_message = os.environ.get('COMMIT_MESSAGE', 'No commit message')

          if not webhook_url:
              print("Webhook URL is empty. Skipping notification.")
              exit(0)

          if status == "success":
              title = f"🟢 **NEW ANDROID BUILD AVAILABLE (Build #{run_number})**"
              color = 3066993
              description = (
                  "📥 **Nhấp vào liên kết bên dưới để tải file APK trực tiếp về máy:**\n\n"
                  f"🔹 [**TẢI BẢN RELEASE APK (#{run_number})**](https://github.com/tunnaduong/cbh-youth-online-mobile/releases/download/dhphuc-android/app-release.apk)\n\n"
                  "---\n"
                  "**Thông tin phiên bản:**\n"
                  f"- **Nhánh (Branch):** `{ref_name}`\n"
                  f"- **Mã commit:** `{sha}`\n"
                  f"- **Changelog:** {commit_message}"
              )
          elif status == "failure":
              title = f"🔴 **ANDROID BUILD FAILED (Build #{run_number})**"
              color = 15158332
              description = f"❌ Đã xảy ra lỗi trong quá trình build file APK.\n- **Nhánh (Branch):** `{ref_name}`\n- **Mã commit:** `{sha}`\n- **Changelog:** {commit_message}"
          else:
              title = f"⚪ **ANDROID BUILD CANCELLED (Build #{run_number})**"
              color = 9807270
              description = f"⚠️ Quy trình build thứ `#{run_number}` đã bị hủy bỏ."

          payload = {
              "embeds": [{
                  "title": title,
                  "description": description,
                  "color": color
              }]
          }

          req = urllib.request.Request(
              webhook_url, 
              data=json.dumps(payload).encode('utf-8'), 
              headers={'Content-Type': 'application/json', 'User-Agent': 'Mozilla/5.0'}
          )
          try:
              with urllib.request.urlopen(req) as response:
                  print("Notification sent successfully:", response.status)
          except Exception as e:
              print("Error sending notification:", e)

