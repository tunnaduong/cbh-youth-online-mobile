name: Upload iOS to App Store Connect

# Each pull request merged into main is built for the App Store and sent to
# App Store Connect (it shows up in TestFlight once Apple has processed it;
# submitting it for review stays a manual step in App Store Connect).
# Can also be started by hand from the Actions tab.
#
# Secrets this workflow needs (Settings > Secrets and variables > Actions):
#   DIST_CERTIFICATE_BASE64          "Apple Distribution" certificate (.p12), base64
#   DIST_P12_PASSWORD                password of that .p12
#   APPSTORE_PROVISIONING_PROFILE_BASE64
#                                    App Store profile for com.fatties.youth, base64
#   APPSTORE_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64
#                                    App Store profile for com.fatties.youth.share-extension, base64
#   ASC_KEY_ID                       App Store Connect API key id (role App Manager or Admin)
#   ASC_ISSUER_ID                    issuer id shown above the API key list
#   ASC_PRIVATE_KEY                  content of the AuthKey_<id>.p8 file
# Optional: DISCORD_WEBHOOK_IOS (same channel as build-ios.yml).
#
# Make a base64 value on a Mac with:  base64 -i file.p12 | pbcopy

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

# Never cancel a run that may be halfway through an upload; a second merge
# waits for the first one instead.
concurrency:
  group: app-store-upload
  cancel-in-progress: false

jobs:
  upload-app-store:
    name: Build & upload to App Store Connect
    # A closed pull request that was not merged does nothing.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read
    env:
      # Same reason as build-ios.yml: react-native-paste-input's podspec
      # needs it to install.
      RCT_NEW_ARCH_ENABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The merge commit on main (for a manual run: the chosen branch).
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure Node path for Xcode build phases
        run: sudo ln -sf $(which node) /usr/local/bin/node

      - name: Install distribution certificate and App Store profiles
        env:
          DIST_CERTIFICATE_BASE64: ${{ secrets.DIST_CERTIFICATE_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          APPSTORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPSTORE_PROVISIONING_PROFILE_BASE64 }}
          APPSTORE_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPSTORE_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
        run: |
          for name in DIST_CERTIFICATE_BASE64 DIST_P12_PASSWORD APPSTORE_PROVISIONING_PROFILE_BASE64 APPSTORE_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name"; exit 1; fi
          done

          CERTIFICATE_PATH=$RUNNER_TEMP/dist_certificate.p12
          PP_PATH=$RUNNER_TEMP/appstore_pp.mobileprovision
          SHARE_PP_PATH=$RUNNER_TEMP/appstore_share_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-store.keychain-db

          echo -n "$DIST_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$APPSTORE_PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          echo -n "$APPSTORE_SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64" | base64 --decode -o $SHARE_PP_PATH

          security create-keychain -p "github-actions-pwd" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "github-actions-pwd" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          security default-keychain -s $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$DIST_P12_PASSWORD" -t cert -f pkcs12 -A
          security set-key-partition-list -S apple-tool:,apple: -s -k "github-actions-pwd" $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
          cp $SHARE_PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

          security cms -D -i $PP_PATH > $RUNNER_TEMP/profile.plist
          security cms -D -i $SHARE_PP_PATH > $RUNNER_TEMP/share_profile.plist

          # An App Store profile has no device list; a development or ad hoc
          # one does. Stop early instead of failing at the upload.
          for plist in profile.plist share_profile.plist; do
            if plutil -extract ProvisionedDevices raw $RUNNER_TEMP/$plist > /dev/null 2>&1; then
              echo "::error::$plist is not an App Store distribution profile (it lists devices)"
              exit 1
            fi
          done

          TEAM_ID=$(plutil -extract TeamIdentifier.0 raw $RUNNER_TEMP/profile.plist)
          FULL_APP_ID=$(plutil -extract Entitlements.application-identifier raw $RUNNER_TEMP/profile.plist)
          SHARE_FULL_APP_ID=$(plutil -extract Entitlements.application-identifier raw $RUNNER_TEMP/share_profile.plist)

          {
            echo "DEVELOPMENT_TEAM=$TEAM_ID"
            echo "PROVISIONING_PROFILE_UUID=$(plutil -extract UUID raw $RUNNER_TEMP/profile.plist)"
            echo "PROVISIONING_PROFILE_NAME=$(plutil -extract Name raw $RUNNER_TEMP/profile.plist)"
            echo "BUNDLE_ID=${FULL_APP_ID#*.}"
            echo "SHARE_PROVISIONING_PROFILE_UUID=$(plutil -extract UUID raw $RUNNER_TEMP/share_profile.plist)"
            echo "SHARE_PROVISIONING_PROFILE_NAME=$(plutil -extract Name raw $RUNNER_TEMP/share_profile.plist)"
            echo "SHARE_BUNDLE_ID=${SHARE_FULL_APP_ID#*.}"
          } >> $GITHUB_ENV

      - name: Install App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name"; exit 1; fi
          done
          KEY_PATH=$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8
          printf '%s\n' "$ASC_PRIVATE_KEY" > $KEY_PATH
          {
            echo "ASC_KEY_PATH=$KEY_PATH"
            echo "ASC_KEY_ID=$ASC_KEY_ID"
            echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"
          } >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      # Same number as the rest of the CI: the highest run number reached by
      # the two build workflows (what build-number.yml commits to main). The
      # merged PR comes from dhphuc, whose push already ran those builds, so
      # each merge gets a new number. App Store Connect refuses a build
      # number it has already received for this version.
      - name: Set build number and production OTA channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          latest=0
          for workflow in build-android.yml build-ios.yml; do
            number=$(gh api "repos/$REPO/actions/workflows/$workflow/runs?per_page=1" --jq '.workflow_runs[0].run_number // 0')
            echo "$workflow: run #$number"
            if [ "$number" -gt "$latest" ]; then latest=$number; fi
          done
          committed=$(node -p 'require("./app.json").expo.ios.buildNumber')
          if [ "$committed" -gt "$latest" ]; then latest=$committed; fi
          node scripts/set-build-number.js "$latest"
          node scripts/set-ota-channel.js production
          echo "APP_VERSION=$(node -p 'require("./app.json").expo.version')" >> $GITHUB_ENV
          echo "APP_BUILD_NUMBER=$latest" >> $GITHUB_ENV

      - name: Generate the native project (expo prebuild)
        env:
          CI: "1"
        run: |
          npx expo prebuild --platform ios --no-install
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local

      - name: Set up ccache
        run: |
          which ccache || brew install ccache
          sudo ln -sf "$(which ccache)" /usr/local/bin/ccache
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          node -e '
            const fs = require("fs");
            const file = "ios/Podfile.properties.json";
            const props = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, "utf8")) : {};
            props["apple.ccacheEnabled"] = "true";
            fs.writeFileSync(file, JSON.stringify(props, null, 2) + "\n");
          '

      # Shares the compiled objects of build-ios.yml (also a Release build).
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-device-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ccache-device-

      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install Pods
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          cd ios
          pod install || (pod update hermes-engine --no-repo-update && pod install)

      # See build-ios.yml: the share extension links no pods, so without
      # these it cannot find the ccache wrappers.
      - name: Point every target at the ccache wrappers
        run: |
          cd ios
          gem list -i xcodeproj > /dev/null || gem install xcodeproj --no-document
          ruby -rxcodeproj -e '
            project = Xcodeproj::Project.open(Dir["*.xcodeproj"].first)
            project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings["PODS_ROOT"] ||= "$(SRCROOT)/Pods"
                config.build_settings["REACT_NATIVE_PATH"] ||= "$(SRCROOT)/../node_modules/react-native"
              end
            end
            project.save
          '

      - name: Detect iOS Project Name
        run: |
          cd ios
          echo "APP_NAME=$(basename *.xcworkspace .xcworkspace)" >> $GITHUB_ENV

      - name: Install xcbeautify
        run: which xcbeautify || brew install xcbeautify

      # Per-target profiles (command-line overrides would apply the main
      # app's profile to the share extension too - see build-ios.yml).
      - name: Configure per-target code signing (App Store)
        run: |
          cd ios
          ruby -rxcodeproj -e '
            project = Xcodeproj::Project.open("#{ENV["APP_NAME"]}.xcodeproj")
            target_profiles = {
              ENV["APP_NAME"] => [ENV["PROVISIONING_PROFILE_UUID"], ENV["PROVISIONING_PROFILE_NAME"]],
              "ShareExtension" => [ENV["SHARE_PROVISIONING_PROFILE_UUID"], ENV["SHARE_PROVISIONING_PROFILE_NAME"]],
            }
            project.targets.each do |target|
              uuid, name = target_profiles[target.name]
              next unless uuid
              target.build_configurations.each do |config|
                config.build_settings["CODE_SIGN_STYLE"] = "Manual"
                config.build_settings["DEVELOPMENT_TEAM"] = ENV["DEVELOPMENT_TEAM"]
                config.build_settings["PROVISIONING_PROFILE"] = uuid
                config.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = name
                config.build_settings["CODE_SIGN_IDENTITY"] = "Apple Distribution"
              end
            end
            project.save
          '

      - name: Build iOS Archive
        run: |
          cd ios
          set -o pipefail
          xcodebuild archive \
            -workspace "$APP_NAME.xcworkspace" \
            -scheme "$APP_NAME" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcbeautify --quiet --renderer github-actions

      - name: ccache statistics
        if: always()
        run: ccache --show-stats || true

      # destination=upload: xcodebuild signs the IPA and sends it straight
      # to App Store Connect with the API key.
      - name: Export and upload to App Store Connect
        run: |
          cat <<EOF > $RUNNER_TEMP/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>$DEVELOPMENT_TEAM</string>
              <key>uploadSymbols</key>
              <true/>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROVISIONING_PROFILE_NAME</string>
                  <key>$SHARE_BUNDLE_ID</key>
                  <string>$SHARE_PROVISIONING_PROFILE_NAME</string>
              </dict>
          </dict>
          </plist>
          EOF

          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcbeautify --renderer github-actions

      - name: Summary
        run: |
          {
            echo "### ✅ Đã gửi lên App Store Connect"
            echo "- Phiên bản: \`$APP_VERSION\` (build \`$APP_BUILD_NUMBER\`)"
            echo "- Commit: \`$(git rev-parse --short HEAD)\`"
            echo "- Apple xử lý xong (thường 5-30 phút) thì build hiện trong TestFlight."
          } >> $GITHUB_STEP_SUMMARY
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "APP_BUILD_NUMBER=$APP_BUILD_NUMBER" >> $GITHUB_OUTPUT
        id: summary

      - name: Clean up keychain and API key
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-store.keychain-db || true
          rm -f $RUNNER_TEMP/AuthKey_*.p8

    outputs:
      version: ${{ steps.summary.outputs.APP_VERSION }}
      build: ${{ steps.summary.outputs.APP_BUILD_NUMBER }}

  notify-discord:
    name: Send Discord Notification
    runs-on: ubuntu-latest
    needs: [upload-app-store]
    if: always() && needs.upload-app-store.result != 'skipped'
    steps:
      - name: Notify
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_IOS }}
          RESULT: ${{ needs.upload-app-store.result }}
          VERSION: ${{ needs.upload-app-store.outputs.version }}
          BUILD: ${{ needs.upload-app-store.outputs.build }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: python
        run: |
          import os, json, urllib.request
          url = os.environ.get("WEBHOOK_URL", "")
          if not url:
              print("No webhook, skipping")
              raise SystemExit(0)
          ok = os.environ["RESULT"] == "success"
          pr = os.environ.get("PR_NUMBER")
          pr_line = f"\n- **PR:** #{pr} {os.environ.get('PR_TITLE', '')}" if pr else ""
          if ok:
              title = f"🍏 **ĐÃ GỬI LÊN APP STORE CONNECT ({os.environ['VERSION']} - build {os.environ['BUILD']})**"
              desc = "Build sẽ hiện trong TestFlight sau khi Apple xử lý xong." + pr_line
              color = 3066993
          else:
              title = "🔴 **GỬI LÊN APP STORE CONNECT THẤT BẠI**"
              desc = f"Xem log: {os.environ['RUN_URL']}" + pr_line
              color = 15158332
          payload = {"embeds": [{"title": title, "description": desc, "color": color}]}
          req = urllib.request.Request(url, data=json.dumps(payload).encode(),
                                       headers={"Content-Type": "application/json", "User-Agent": "Mozilla/5.0"})
          try:
              with urllib.request.urlopen(req) as r:
                  print("Sent:", r.status)
          except Exception as e:
              print("Error:", e)
