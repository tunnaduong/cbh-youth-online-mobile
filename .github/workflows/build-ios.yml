name: Build Unsigned iOS IPA

on:
  push:
    branches:
      - dhphuc
  workflow_dispatch:

jobs:
  build-ios-real:
    name: Build & Pack Unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure Node path for Xcode build phases
        run: |
          sudo ln -sf $(which node) /usr/local/bin/node
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local

      # =========================================================================
      # # ĐÃ VÔ HIỆU HÓA: Phần cài đặt chứng chỉ & Provisioning Profile cũ (Signed)
      # =========================================================================
      # - name: Install Apple Certificate and Provisioning Profile (Disabled for Unsigned)
      #   env:
      #     BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      #     P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      #     BUILD_PROVISIONING_PROFILE_BASE64: ${{ secrets.BUILD_PROVISIONING_PROFILE_BASE64 }}
      #   run: |
      #     CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
      #     PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
      #     KEYCHAIN_PATH=$RUNNER_TEMP/app-build.keychain-db
      #     ... (Logic cũ được giữ lại ở đây để tiện bật lại sau)
      # =========================================================================

      - name: Install dependencies
        run: npm ci

      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install Pods
        run: |
          cd ios
          pod install

      - name: Detect iOS Project Name
        run: |
          cd ios
          WORKSPACE_NAME=$(basename *.xcworkspace .xcworkspace)
          echo "APP_NAME=$WORKSPACE_NAME" >> $GITHUB_ENV

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Build iOS Archive (Unsigned)
        run: |
          cd ios
          set -o pipefail
          xcodebuild clean archive \
            -workspace "${{ env.APP_NAME }}.xcworkspace" \
            -scheme "${{ env.APP_NAME }}" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/${{ env.APP_NAME }}.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SUPPORTED_PLATFORMS="iphoneos" \
            EXCLUDED_ARCHS="x86_64 i386" \
            | xcbeautify --quiet --renderer github-actions

      - name: Pack Unsigned App into IPA
        run: |
          # Tạo cấu trúc thư mục Payload tiêu chuẩn của một file IPA
          mkdir -p $RUNNER_TEMP/Payload
          
          # Copy tệp .app từ archive vào trong Payload
          cp -R "$RUNNER_TEMP/${{ env.APP_NAME }}.xcarchive/Products/Applications/"*.app $RUNNER_TEMP/Payload/
          
          # Nén thư mục Payload thành tệp .ipa
          cd $RUNNER_TEMP
          zip -r ${{ env.APP_NAME }}-unsigned.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned-ipa
          path: ${{ runner.temp }}/*-unsigned.ipa
          retention-days: 1

  publish-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-ios-real]
    permissions:
      contents: write
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-unsigned-ipa
          path: ${{ github.workspace }}/release_artifacts

      - name: Create or Update Pre-release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: "${{ github.workspace }}/release_artifacts/*"
          tag: "dhphuc-ios"
          name: "${{ github.sha }}"
          body: |
            ### 🚀 iOS Unsigned IPA Build Details
            - **Commit SHA:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`
            - **Changelog:** ${{ github.event.head_commit.message }}
            
            > ⚠️ Đây là bản build định dạng **IPA (Unsigned)**, dùng để phục vụ cho các công cụ ký lại thủ công (side-loading/re-signing).
          prerelease: true
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}

  notify-discord:
    name: Send Discord Notification
    runs-on: ubuntu-latest
    needs: [build-ios-real, publish-release]
    if: always()
    steps:
      - name: Run Discord Notification Script
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_IOS }}
          BUILD_RESULT: ${{ needs.build-ios-real.result }}
          RELEASE_RESULT: ${{ needs.publish-release.result }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: python
        run: |
          import os, json, urllib.request

          build_ok = os.environ.get('BUILD_RESULT', '') == 'success'
          release_ok = os.environ.get('RELEASE_RESULT', '') == 'success'
          ref_name = os.environ.get('REF_NAME', '')
          sha = os.environ.get('COMMIT_SHA', '')
          run_number = os.environ.get('RUN_NUMBER', '')
          webhook_url = os.environ.get('WEBHOOK_URL', '')
          commit_message = os.environ.get('COMMIT_MESSAGE', 'No commit message')

          if not webhook_url:
              print("Webhook URL is empty. Skipping notification.")
              exit(0)

          if build_ok and release_ok:
              title = f"🟢 **NEW IOS UNSIGNED IPA AVAILABLE (Build #{run_number})**"
              color = 3066993
              description = (
                  "⚠️ **Lưu ý:** Đây là gói build **Unsigned IPA** (không kèm chứng chỉ).\n\n"
                  "📦 **Tải trực tiếp file IPA:**\n"
                  "📥 [**TẢI FILE IPA (UNSIGNED)**](https://github.com/tunnaduong/cbh-youth-online-mobile/releases/download/dhphuc-ios/CBHOnline-unsigned.ipa)\n\n"
                  "---\n"
                  "**Thông tin phiên bản:**\n"
                  f"- **Nhánh (Branch):** `{ref_name}`\n"
                  f"- **Mã commit:** `{sha}`\n"
                  f"- **Changelog:** {commit_message}"
              )
          else:
              title = f"🔴 **IOS UNSIGNED IPA BUILD FAILED (Build #{run_number})**"
              color = 15158332
              description = f"❌ Đã xảy ra lỗi trong quá trình build file IPA không ký.\n- **Nhánh (Branch):** `{ref_name}`\n- **Mã commit:** `{sha}`\n- **Changelog:** {commit_message}"

          payload = {
              "embeds": [{
                  "title": title,
                  "description": description,
                  "color": color
              }]
          }

          req = urllib.request.Request(
              webhook_url, 
              data=json.dumps(payload).encode('utf-8'), 
              headers={'Content-Type': 'application/json', 'User-Agent': 'Mozilla/5.0'}
          )
          try:
              with urllib.request.urlopen(req) as response:
                  print("Notification sent successfully:", response.status)
          except Exception as e:
              print("Error sending notification:", e)