name: Build iOS Signed IPA

on:
  push:
    branches:
      - dhphuc
  workflow_dispatch:

jobs:
  build-ios-real:
    name: Build & Sign Real Device IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure Node path for Xcode build phases
        run: |
          sudo ln -sf $(which node) /usr/local/bin/node
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISIONING_PROFILE_BASE64: ${{ secrets.BUILD_PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-build.keychain-db

          # Giải mã dữ liệu mã hóa Base64 sang file vật lý trong thư mục tạm
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "github-actions-pwd" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "github-actions-pwd" $KEYCHAIN_PATH

          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          security default-keychain -s $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH \
            -k $KEYCHAIN_PATH \
            -P "$P12_PASSWORD" \
            -t cert \
            -f pkcs12 \
            -A

          security set-key-partition-list -S apple-tool:,apple: -s -k "github-actions-pwd" $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

          security cms -D -i $PP_PATH > $RUNNER_TEMP/profile.plist
          TEAM_ID=$(plutil -extract TeamIdentifier.0 raw $RUNNER_TEMP/profile.plist || plutil -extract Entitlements.com.apple.developer.team-identifier raw $RUNNER_TEMP/profile.plist)
          UUID=$(plutil -extract UUID raw $RUNNER_TEMP/profile.plist)
          PROFILE_NAME=$(plutil -extract Name raw $RUNNER_TEMP/profile.plist)
          FULL_APP_ID=$(plutil -extract Entitlements.application-identifier raw $RUNNER_TEMP/profile.plist)
          BUNDLE_ID="${FULL_APP_ID#*.}"
          if [ "$BUNDLE_ID" = "*" ]; then
            BUNDLE_ID="com.fatties.youth"
          fi

          echo "DEVELOPMENT_TEAM=$TEAM_ID" >> $GITHUB_ENV
          echo "PROVISIONING_PROFILE_UUID=$UUID" >> $GITHUB_ENV
          echo "PROVISIONING_PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "BUNDLE_ID=$BUNDLE_ID" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install Pods
        run: |
          cd ios
          pod install

      - name: Detect iOS Project Name
        run: |
          cd ios
          WORKSPACE_NAME=$(basename *.xcworkspace .xcworkspace)
          echo "APP_NAME=$WORKSPACE_NAME" >> $GITHUB_ENV

      - name: Install xcbeautify
        run: brew install xcbeautify

      # Ép các biến môi trường loại bỏ Simulator ngay tại câu lệnh build xcodebuild
      - name: Build iOS Archive
        run: |
          cd ios
          set -o pipefail
          xcodebuild clean archive \
            -workspace "${{ env.APP_NAME }}.xcworkspace" \
            -scheme "${{ env.APP_NAME }}" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/${{ env.APP_NAME }}.xcarchive" \
            DEVELOPMENT_TEAM="${{ env.DEVELOPMENT_TEAM }}" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Development" \
            PROVISIONING_PROFILE_SPECIFIER="${{ env.PROVISIONING_PROFILE_NAME }}" \
            PROVISIONING_PROFILE="${{ env.PROVISIONING_PROFILE_UUID }}" \
            SUPPORTED_PLATFORMS="iphoneos" \
            EXCLUDED_ARCHS="x86_64 i386" \
            | xcbeautify --quiet --renderer github-actions

      - name: Export IPA
        run: |
          cat <<EOF > $RUNNER_TEMP/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>compileBitcode</key>
              <false/>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>${{ env.DEVELOPMENT_TEAM }}</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${{ env.BUNDLE_ID }}</key>
                  <string>${{ env.PROVISIONING_PROFILE_NAME }}</string>
              </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/${{ env.APP_NAME }}.xcarchive" \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/exported_ipa

          mv $RUNNER_TEMP/exported_ipa/*.ipa $RUNNER_TEMP/${{ env.APP_NAME }}-signed.ipa

      - name: Upload Real IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed-ipa
          path: ${{ runner.temp }}/*-signed.ipa
          retention-days: 1

  publish-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-ios-real]
    permissions:
      contents: write
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-signed-ipa
          path: ${{ github.workspace }}/release_artifacts

      - name: Create or Update Pre-release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: "${{ github.workspace }}/release_artifacts/*"
          tag: "dhphuc-ios"
          name: "${{ github.sha }}"
          body: |
            ### 🚀 iOS Build Details
            - **Commit SHA:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`
            - **Changelog:** ${{ github.event.head_commit.message }}
            
            ### 🔗 Liên kết cài đặt trực tuyến (Mở bằng Safari trên iPhone)
            Nhấn vào link dưới đây để đến trang cài đặt ứng dụng dành cho thiết bị thật:
            
            👉 **[BẤM VÀO ĐÂY ĐỂ CÀI ĐẶT](https://huanhoahongso3-collab.github.io/autosignipacert/20260620-092352/)**
          prerelease: true
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}

  notify-discord:
    name: Send Discord Notification
    runs-on: ubuntu-latest
    needs: [build-ios-real, publish-release]
    if: always()
    steps:
      - name: Run Discord Notification Script
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_IOS }}
          BUILD_RESULT: ${{ needs.build-ios-real.result }}
          RELEASE_RESULT: ${{ needs.publish-release.result }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: python
        run: |
          import os, json, urllib.request

          build_ok = os.environ.get('BUILD_RESULT', '') == 'success'
          release_ok = os.environ.get('RELEASE_RESULT', '') == 'success'
          ref_name = os.environ.get('REF_NAME', '')
          sha = os.environ.get('COMMIT_SHA', '')
          run_number = os.environ.get('RUN_NUMBER', '')
          webhook_url = os.environ.get('WEBHOOK_URL', '')
          commit_message = os.environ.get('COMMIT_MESSAGE', 'No commit message')

          if not webhook_url:
              print("Webhook URL is empty. Skipping notification.")
              exit(0)

          if build_ok and release_ok:
              title = f"🟢 **NEW IOS BUILD AVAILABLE (Build #{run_number})**"
              color = 3066993
              description = (
                  "📲 **Vui lòng lựa chọn phương thức tải/cài đặt phù hợp:**\n\n"
                  "🔗 **1. Cài đặt trực tuyến (Mở bằng Safari trên iPhone):**\n"
                  "👉 [**BẤM VÀO ĐÂY ĐỂ CÀI ĐẶT**](https://huanhoahongso3-collab.github.io/autosignipacert/20260620-092352/)\n\n"
                  "📦 **2. Tải trực tiếp file IPA về máy:**\n"
                  "📥 [**TẢI FILE CBHOnline-signed.ipa**](https://github.com/tunnaduong/cbh-youth-online-mobile/releases/download/dhphuc-ios/CBHOnline-signed.ipa)\n\n"
                  "---\n"
                  "**Thông tin phiên bản:**\n"
                  f"- **Nhánh (Branch):** `{ref_name}`\n"
                  f"- **Mã commit:** `{sha}`\n"
                  f"- **Changelog:** {commit_message}"
              )
          else:
              title = f"🔴 **IOS BUILD FAILED (Build #{run_number})**"
              color = 15158332
              description = f"❌ Đã xảy ra lỗi trong quá trình build hoặc phát hành file IPA.\n- **Nhánh (Branch):** `{ref_name}`\n- **Mã commit:** `{sha}`\n- **Changelog:** {commit_message}"

          payload = {
              "embeds": [{
                  "title": title,
                  "description": description,
                  "color": color
              }]
          }

          req = urllib.request.Request(
              webhook_url, 
              data=json.dumps(payload).encode('utf-8'), 
              headers={'Content-Type': 'application/json', 'User-Agent': 'Mozilla/5.0'}
          )
          try:
              with urllib.request.urlopen(req) as response:
                  print("Notification sent successfully:", response.status)
          except Exception as e:
              print("Error sending notification:", e)
